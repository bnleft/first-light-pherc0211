[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vesuvius-render-preflight"
version = "0.1.0"
description = "Inspect stored coverage and depth profiles of rendered scroll Zarr slabs."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["numpy>=2.0,<3", "zarr>=3.1,<4"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "ruff>=0.14,<1"]

[project.scripts]
render-preflight = "render_preflight.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/render_preflight"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/examples/*.py", "/examples/*.json", "/docs", "/README.md", "/LICENSE", "/pyproject.toml", "/uv.lock"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
